<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=block" rel="stylesheet" />
<script src="vendor/gsap/dist/gsap.min.js"></script>
<script src="vendor/three/build/three.min.js"></script>
<script src="vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="vendor/three/examples/js/environments/RoomEnvironment.js"></script>
<script src="vendor/three/examples/js/shaders/CopyShader.js"></script>
<script src="vendor/three/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/three/examples/js/shaders/BokehShader.js"></script>
<script src="vendor/three/examples/js/shaders/FXAAShader.js"></script>
<script src="vendor/three/examples/js/postprocessing/Pass.js"></script>
<script src="vendor/three/examples/js/postprocessing/EffectComposer.js"></script>
<script src="vendor/three/examples/js/postprocessing/RenderPass.js"></script>
<script src="vendor/three/examples/js/postprocessing/ShaderPass.js"></script>
<script src="vendor/three/examples/js/postprocessing/BokehPass.js"></script>
<script src="vendor/three/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="personagem.js"></script><script src="personagens-extra.js"></script>
<script src="objetos.js"></script><script src="objetos-extra.js"></script>
<script src="motor2.js"></script><script src="montagem.js"></script><script src="audio/palavras.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root, .clip { position: absolute; inset: 0; overflow: hidden; }
  #tres { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #camada2d, #camadaTela, #legendas { position: absolute; inset: 0; }
  .ator { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="clip"><canvas id="tres" width="1080" height="1920"></canvas><div id="camada2d"></div><div id="camadaTela"></div><div id="legendas"></div></div></div>
<script>
  const tl = gsap.timeline({ paused: true });
  const M = Montagem.criar({ tl, dur: 3, fala: window.PALAVRAS, cenario: Motor2, canvas: '#tres', camada2d: '#camada2d', camadaTela: '#camadaTela', legendas: '#legendas',
    filtro: (luz) => `brightness(1.02) saturate(1.05) drop-shadow(-6px 2px 0 rgba(255,214,160,.5))` });
  const cena = M.cena;
  // três planos de teste: geral, médio com fundo desfocado, contra-plongée
  const planos = [
    { pos: [-1.2, 3.4, 13], alvo: [0, 1.4, -14], fov: 48, foco: 12 },
    { pos: [0.25, 1.3, 4.6], alvo: [0.2, 1.0, 0], fov: 36, foco: 4.0 },
    { pos: [0.2, 0.45, 3.8], alvo: [0.1, 2.1, -6], fov: 50, foco: 3.0 },
  ];
  const plano = (tt) => planos[Math.min(2, Math.floor(tt))];
  cena.cam.quadro = (tt) => plano(tt);
  cena.foco = (tt) => plano(tt).foco;
  const masc = M.ator('masc', 'mascote', 1.0, (tt) => tt < 1 ? [-0.9, 0, 1.2] : [-0.32, 0, 1.0]);
  const cli = M.ator('cli', 'cliente2', 0.95, (tt) => tt < 1 ? [1.3, 0, 0.2] : [0.62, 0, -0.1]);
  M.pose(masc, 'apontando', 0, 3); M.pose(cli, 'assustado', 0, 3);
  window.__pronto = cena.pronto;
  M.iniciar();
</script></body></html>
