<script>
(function () {
  const DUR = 63.4, FIM_FALA = 61.9;
  const tl = gsap.timeline({ paused: true });
  const M = Montagem.criar({ tl, dur: DUR, fala: window.PALAVRAS, cenario: Ricos3D, canvas: '#tres', camada2d: '#camada2d', camadaTela: '#camadaTela', legendas: '#legendas',

  const { t, W, B, THREE, cena } = M;
  const P = cena.P, Z = Ricos3D.Z, suave = M.suave, lerp = M.lerp;
  const T = {
    real: t('real', 1), rico1: t('rico', 1),
    b2: B(2), dono2: t('dono', 2), empresas: t('empresas,', 2), acoes2: t('ações.', 2),
    b3: B(3), um3: t('"Um', 3), ganho: t('ganho', 3),
    b4: B(4), empresa4: t('empresa', 4), sobem: t('sobem,', 4), fortuna: t('fortuna', 4), bilhoes: t('bilhões.', 4),
    b5: B(5), nunca: t('nunca', 5), vende: t('vende', 5),
    b6: B(6), como6: t('como', 6), iate: t('iate?', 6),
    b7: B(7), emprest7: t('empréstimo', 7), banco: t('banco', 7), acoes7: t('ações', 7), garantia: t('garantia.', 7),
    b8: B(8), renda: t('renda,', 8), sobe8: t('sobe', 8), vendida: t('vendida', 8), imposto: t('imposto.', 8),
    b9: B(9), vinte: t('vinte', 9), ricos9: t('ricos', 9), pagaram: t('pagaram', 9), tres: t('três', 9), enriq: t('enriqueceram.', 9),
    b10: B(10), isento: t('isento', 10), agora: t('agora,', 10), cinquenta: t('cinquenta', 10), dez: t('dez', 10),
    b11: B(11), mas: t('mas', 11), dono11: t('dono.', 11),
    b12: B(12), acao12: t('ação', 12), socio: t('sócio', 12), patrao: t('patrão.', 12),
  };
  const zC = Z.COB, zP = Z.PORT, zB = Z.BOLSA, zM = Z.MARINA, zK = Z.BANCO, zS = Z.ESTUDIO;
  const palco = (tt) => tt < T.b3 ? 'C' : tt < T.b4 ? 'P' : tt < T.b5 ? 'B' : tt < T.b6 ? 'K' : tt < T.b7 ? 'M' : tt < T.b9 ? 'K' : tt < T.b11 ? 'S' : tt < T.b12 ? 'C' : 'P';

  // ---------- câmera ----------
  const ch = [];
  const K = (tt, pos, alvo, fov = 40, foco = 4, roll = 0) => ch.push([tt, pos, alvo, fov, foco, roll]);
  const C = (tt, pos, alvo, fov = 40, foco = 4, roll = 0) => { ch.push([tt - 0.001, null]); K(tt, pos, alvo, fov, foco, roll); };
  // 1 cobertura: o holerite de um real
  K(0, [0.7, 1.45, zC + 1.0], [0.6, 1.35, zC - 1.4], 34, 2.4);
  K(2.1, [0.6, 1.42, zC + 0.6], [0.6, 1.35, zC - 1.4], 30, 2.0);
  C(2.2, [3.6, 2.2, zC + 5.6], [0, 3.0, zC - 5], 46, 7.5);
  K(T.b2 - 0.05, [2.6, 2.5, zC + 3.8], [0, 4.0, zC - 6], 42, 6.5);
  // 2 o segredo: dono de empresas
  C(T.b2, [-1.6, 1.7, zC + 3.2], [0.5, 1.3, zC - 1.4], 40, 4.6);
  K(T.dono2 - 0.05, [-1.2, 1.65, zC + 2.6], [0.5, 1.3, zC - 1.4], 38, 4.1);
  C(T.dono2, [2.4, 1.55, zC + 1.0], [3.6, 1.05, zC - 1.8], 36, 3.0);
  K(T.acoes2 - 0.05, [3.0, 1.45, zC + 0.5], [3.8, 1.05, zC - 1.8], 30, 2.5);
  C(T.acoes2, [-0.6, 1.9, zC + 4.4], [1.6, 1.2, zC - 1.6], 44, 5.6);
  K(T.b3 - 0.05, [-0.3, 1.9, zC + 4.0], [1.6, 1.2, zC - 1.6], 42, 5.2);
  // 3 portaria: a piada do Juninho
  C(T.b3, [-4.5, 2.6, zP + 6], [1.0, 1.4, zP - 2], 46, 8.6);
  K(T.um3 - 0.05, [-1.6, 2.0, zP + 3.6], [1.5, 1.3, zP - 1.6], 42, 5.9);
  C(T.um3, [1.6, 1.45, zP + 0.4], [1.6, 1.4, zP - 1.6], 34, 2.0);
  C(T.ganho, [0.5, 1.6, zP + 1.8], [1.6, 1.3, zP - 1.6], 40, 3.6);
  K(T.b4 - 0.05, [0.7, 1.6, zP + 1.4], [1.6, 1.3, zP - 1.6], 38, 3.2);
  // 4 bolsa: as ações sobem
  C(T.b4, [0, 4, zB + 16], [0, 6, zB - 10], 50, 24);
  K(T.sobem - 0.05, [-4, 3, zB + 10], [0, 6, zB - 9], 48, 18);
  C(T.sobem, [-14, 1.6, zB - 2], [0, 6, zB - 9], 46, 15);
  C(T.fortuna, [13, 6, zB + 5], [10, 8, zB - 8], 44, 14);
  K(T.b5 - 0.05, [11, 9, zB + 6], [11, 9.2, zB - 8], 40, 14);
  // 5 cofre: quase nunca vende
  C(T.b5, [3.6, 2.2, zK + 4.5], [4.8, 1.9, zK - 5.5], 46, 8.6);
  C(T.vende, [4.3, 1.2, zK - 2.2], [4.2, 1.05, zK - 4.0], 34, 1.8);
  K(T.b6 - 0.05, [4.25, 1.15, zK - 2.5], [4.2, 1.05, zK - 4.0], 30, 1.5);
  // 6 marina: o iate
  C(T.b6, [-4.4, 1.7, zM + 15.2], [-4.0, 1.5, zM + 12], 38, 3.3);
  C(T.como6, [-13, 3, zM + 23], [8, 4, zM - 6], 48, 28);
  K(T.b7 - 0.05, [-11, 2.6, zM + 19], [8, 5, zM - 6], 44, 24);
  // 7 banco: empréstimo com garantia
  C(T.b7, [-1.8, 1.9, zK + 3.8], [-1.8, 1.3, zK - 2.0], 46, 4.9);
  C(T.banco, [-0.4, 1.6, zK + 1.6], [-1.6, 1.3, zK - 2.0], 38, 3.8);
  C(T.acoes7, [-2.0, 1.75, zK - 0.4], [-2.2, 1.25, zK - 2.0], 34, 1.7);
  K(T.b8 - 0.05, [-1.9, 1.8, zK - 0.1], [-2.2, 1.25, zK - 2.0], 32, 2.0);
  // 8 não é renda / não paga imposto
  C(T.b8, [3, 3.6, zK + 6], [0, 1.8, zK - 5], 46, 9.5);
  C(T.sobe8, [-3.2, 1.45, zK + 1.8], [-2.6, 1.4, zK - 1.0], 36, 2.9);
  C(T.vendida + 0.4, [5.5, 2.4, zK + 1.0], [5.5, 2.6, zK - 6.6], 40, 7.6);
  K(T.b9 - 0.05, [5.5, 2.5, zK - 1.0], [5.5, 2.6, zK - 6.6], 36, 5.6);
  // 9 estúdio: 3,4%
  C(T.b9, [0, 2.2, zS + 9], [0, 3.0, zS - 6], 46, 15);
  K(T.tres - 0.05, [0, 6.5, zS + 17], [0, 6.5, zS - 6], 48, 23);
  C(T.tres, [5.5, 0.9, zS + 2.0], [0.4, 3.2, zS - 6], 52, 8.8);
  K(T.enriq - 0.05, [5.0, 0.8, zS + 1.2], [0.4, 3.4, zS - 6], 50, 8.2);
  C(T.enriq, [-6, 9, zS + 14], [0, 5, zS - 6], 48, 21);
  K(T.b10 - 0.05, [-5, 9, zS + 13], [0, 5, zS - 6], 46, 20);
  // 10 mapa do Brasil
  C(T.b10, [15, 14, zS + 10], [15, 0, zS - 2], 46, 16.5);
  C(T.isento, [16.3, 3.0, zS + 13], [16.3, 2.6, zS - 2.6], 42, 15.6);
  K(T.cinquenta - 0.05, [16.0, 3.1, zS + 11.5], [16.3, 2.6, zS - 2.6], 40, 14);
  C(T.cinquenta, [21, 5, zS + 7], [15.5, 2.2, zS - 2.5], 44, 10);
  K(T.b11 - 0.05, [20, 5.5, zS + 6], [15.5, 2.2, zS - 2.5], 42, 9.6);
  // 11 cobertura: quem fica rico é quem é dono
  C(T.b11, [0.4, 1.5, zC + 1.6], [0.1, 1.35, zC - 1.4], 38, 3.0);
  C(T.mas, [2.5, 0.6, zC + 5], [0, 3.5, zC - 4], 46, 6.4);
  C(T.dono11, [0, 3.0, zC + 7], [0, 8.4, zC - 7.8], 46, 15);
  K(T.b12 - 0.05, [0, 3.2, zC + 6.4], [0, 8.8, zC - 7.8], 44, 14.6);
  // 12 portaria: o Juninho vira sócio
  C(T.b12, [1.6, 1.7, zP + 5.0], [1.6, 1.3, zP - 1.0], 44, 6.0);
  C(T.acao12, [0.6, 1.5, zP + 0.6], [0.6, 1.4, zP - 1.4], 34, 2.0);
  C(T.socio, [2.6, 1.3, zP + 1.3], [2.6, 1.2, zP - 0.6], 36, 1.9);
  K(FIM_FALA, [2.6, 1.3, zP + 1.7], [2.6, 1.2, zP - 0.6], 40, 2.3);
  K(DUR, [2.6, 1.3, zP + 1.8], [2.6, 1.2, zP - 0.6], 40, 2.4);
  const lerp3 = (a, b, e) => [lerp(a[0], b[0], e), lerp(a[1], b[1], e), lerp(a[2], b[2], e)];
  const eio = (x) => (x < 0 ? 0 : x > 1 ? 1 : x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const chaveEm = (tt) => { let i = 0; while (i < ch.length - 2 && tt >= ch[i + 1][0]) i++; let a = ch[i], b = ch[i + 1]; if (!a[1]) a = b; if (!b[1]) b = a; return [a, b, eio((tt - a[0]) / Math.max(0.001, b[0] - a[0]))]; };
  const tremidas = [[T.real, 0.35], [T.bilhoes, 0.5], [T.renda, 0.4], [T.tres, 0.45], [T.dono11, 0.4], [T.patrao, 0.4]];
  cena.cam.quadro = (tt) => {
    const [a, b, e] = chaveEm(tt);
    const pos = lerp3(a[1], b[1], e), alvo = lerp3(a[2], b[2], e);
    pos[0] += Math.sin(tt * 0.9) * 0.012; pos[1] += Math.sin(tt * 0.7) * 0.01;
    let tr = 0; tremidas.forEach(([t0, d]) => { if (tt >= t0 && tt < t0 + d) tr += 1 - (tt - t0) / d; });
    const k = palco(tt) === 'B' || palco(tt) === 'S' ? 0.3 : 0.04;
    pos[0] += Math.sin(tt * 61) * k * tr; pos[1] += Math.cos(tt * 53) * k * tr;
    return { pos, alvo, fov: lerp(a[3], b[3], e), roll: lerp(a[5] || 0, b[5] || 0, e) };
  };
  cena.foco = (tt) => { const [a, b, e] = chaveEm(tt); return lerp(a[4], b[4], e); };
  gsap.set('#cenaW', { filter: 'blur(0px)', scale: 1 }); tl.set('#flash', { opacity: 0 }, 0);
  [T.b3, T.b4, T.b5, T.b6, T.b7, T.b9, T.b10, T.b11, T.b12].forEach((tc) => {
    tl.fromTo('#cenaW', { filter: 'blur(14px)', scale: 1.06 }, { filter: 'blur(0px)', scale: 1, duration: 0.28, ease: 'power2.out', immediateRender: false }, tc);
    tl.fromTo('#flash', { opacity: 0.22 }, { opacity: 0, duration: 0.2, immediateRender: false }, tc);
  });
  tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.55, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, T.tres);
  tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.45, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, T.dono11);

  // ---------- luz por lugar ----------
  const LUZ = {
    C: { sol: 2.6, corSol: '#ffb46a', hemi: 0.85, corHemi: '#ffc9a0', ceu: '#ffb88a', nevoa: '#f2b89a', exp: 1.0, nuvens: 1, near: 80, far: 420 },
    P: { sol: 0.7, corSol: '#fff1dc', hemi: 1.0, corHemi: '#fff4e0', ceu: '#cfe0ff', nevoa: '#e8e2d6', exp: 1.0, nuvens: 0.6, near: 40, far: 200 },
    B: { sol: 0, corSol: '#ffffff', hemi: 0.35, corHemi: '#7affb8', ceu: '#03100a', nevoa: '#03100a', exp: 1.2, nuvens: 0, near: 30, far: 110 },
    M: { sol: 3.2, corSol: '#fff1dc', hemi: 1.0, corHemi: '#bcd6ff', ceu: '#ffffff', nevoa: '#d9e6ff', exp: 1.0, nuvens: 1, near: 90, far: 420 },
    K: { sol: 0.8, corSol: '#fff1dc', hemi: 1.0, corHemi: '#fff0d8', ceu: '#e8dcc4', nevoa: '#e8dcc4', exp: 1.0, nuvens: 0, near: 40, far: 200 },
    S: { sol: 2.0, corSol: '#ffffff', hemi: 1.0, corHemi: '#ffffff', ceu: '#eef0f6', nevoa: '#eef0f6', exp: 1.0, nuvens: 0, near: 60, far: 300 },
  };
  cena.luz = (tt) => LUZ[palco(tt)];
  cena.luz2d = (tt) => ({ C: 1, P: 1, B: 0.9, M: 1, K: 1, S: 1 })[palco(tt)] || 1;

  // ---------- peças 3D animadas ----------
  const vv = new THREE.Vector3(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), eu = new THREE.Euler(), sc = new THREE.Vector3(1, 1, 1);
  const fmt = (n) => 'US$ ' + Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  M.aCadaQuadro((tt) => {
    // painel da fortuna sobe sem parar (dramatização)
    P.painelFortuna.set(fmt(41237000000 + tt * 183000000 + Math.floor(tt * 30) * 7919), 'FORTUNA');
    // gráfico da bolsa
    const kg = suave((tt - T.empresa4) / (T.bilhoes - T.empresa4 + 0.3));
    P.grafico(kg); P.curvaGrafico.getPoint(Math.max(0.001, kg), vv); P.pontaGrafico.position.copy(vv); P.pontaGrafico.visible = kg > 0.01;
    // moedas jorrando em "bilhões"
    const km = tt - T.bilhoes; P.moedasB.count = km > 0 && palco(tt) === 'B' ? 260 : 0;
    if (P.moedasB.count) { const o = P.curvaGrafico.getPoint(1); for (let i = 0; i < 260; i++) { const a = i * 2.39996, v = 3 + (i % 7) * 0.6, tt2 = Math.max(0, km - (i % 13) * 0.03);
      vv.set(o.x / 3 + Math.cos(a) * tt2 * v * 0.35, o.y / 3 + tt2 * v * 0.9 - tt2 * tt2 * 3.2, (o.z) / 3 + Math.sin(a) * tt2 * v * 0.35); eu.set(tt * 5 + i, i, 0); q.setFromEuler(eu); m4.compose(vv, q, sc); P.moedasB.setMatrixAt(i, m4); }
      P.moedasB.instanceMatrix.needsUpdate = true; }
    // porta do cofre do banco: aberta até "vende", depois fecha
    const fecha = suave((tt - T.vende) / 0.6);
    P.portaBanco.dob.rotation.y = -1.5 * (1 - fecha); P.portaBanco.roda.rotation.z = fecha * 3;
    // pilha de dinheiro do empréstimo
    P.pilha.scale.setScalar(Math.max(0.001, tt < T.b7 ? 0 : suave((tt - T.banco) / 0.5)));
    // barras 3,4%
    P.barras(suave((tt - T.b9) / 2.2), suave((tt - T.pagaram) / 0.6));
    // placa ISENTO -> 10%
    P.placaVira.rotation.y = Math.PI * suave((tt - T.agora) / 0.6);
    // placa DONO
    const kd = tt >= T.dono11 ? Math.min(1, (tt - T.dono11) / 0.35) : 0; P.placaDono.scale.setScalar(Math.max(0.001, kd < 1 ? kd * 1.15 : 1));
    P.maquetes.forEach((m, i) => { m.position.y = 0.9 + Math.max(0, Math.sin((tt - T.dono2) * 6 - i)) * (tt > T.dono2 && tt < T.dono2 + 1.4 ? 0.12 : 0); });
  });

  // ---------- personagens ----------
  const LONGE = [0, -120, -900];
  const jan = (lista) => (tt) => { for (const [a, b, f] of lista) if (tt >= a && tt < b) return typeof f === 'function' ? f(tt) : f; return LONGE; };
