    const on = tt >= T.luzinha && palco(tt) === 'A'; luzinha.visible = false; haloL.intensity = on ? 3 + Math.sin(tt * 9) * 1.5 : 0;
    // ponto vermelho pulando de computador em computador
    const sal = P.saltos, t0 = T.b7 + 0.3, t1 = T.assina, f = Math.min(0.9999, Math.max(0, (tt - t0) / (t1 - t0))) * (sal.length - 1);
    const i0 = Math.floor(f), fr = f - i0, a = sal[i0], b = sal[Math.min(i0 + 1, sal.length - 1)];
    P.ponto.position.set(lerp(a.x, b.x, fr), lerp(a.y, b.y, fr) + Math.sin(Math.PI * fr) * 2.2, lerp(a.z, b.z, fr));
    const npts = Math.min(64, Math.floor(f * 10) + 1); for (let k = 0; k < 64; k++) { const ff = Math.min(f, k / 10), j = Math.floor(ff), r = ff - j, A = sal[j], Bp = sal[Math.min(j + 1, sal.length - 1)]; linhaPts[k * 3] = lerp(A.x, Bp.x, r); linhaPts[k * 3 + 1] = lerp(A.y, Bp.y, r) + Math.sin(Math.PI * r) * 2.2; linhaPts[k * 3 + 2] = lerp(A.z, Bp.z, r) + zD; }
    geoLinha.setDrawRange(0, npts); geoLinha.attributes.position.needsUpdate = true; linhaR.visible = palco(tt) === 'D';
    // carimbos das máquinas
    const carimba = (m, ini) => { const k = tt > ini ? Math.abs(Math.sin((tt - ini) * 6)) : 0; m.braco.position.y = 2.8 - k * 0.55; };
    carimba(P.maqDig, T.assina); carimba(P.maqEst, T.assinar - 0.4);
    P.papeis.forEach((p, i) => { const ti = T.assinar - 0.2 + i * 0.22, k = tt - ti; p.visible = k > 0 && palco(tt) === 'S'; if (!p.visible) return; p.position.set(2.8 + 0.6 + k * 2.2, 1.9 + k * 1.6 - k * k * 0.9, zS - 3.0 + k * 1.2); p.rotation.set(k * 3, k * 2 + i, k); });
    // relógio do roubo e canos de moedas
    const dren = tt >= T.b8 && tt < T.b11; const rel = Math.min(20, Math.max(0, (tt - T.b8) / (T.b9 - T.b8) * 20));
    P.relogio(String(Math.floor(rel)).padStart(2, '0') + ':' + String(Math.floor((rel % 1) * 60)).padStart(2, '0'));
    P.luzOuro5.intensity = dren ? 40 : 0;
    P.canos.forEach((c, ci) => {
      const congela = (ci === 2 || ci === 7) && tt >= T.congelam + (ci === 7 ? 1.8 : 0);
      const kg = congela ? suave((tt - T.congelam - (ci === 7 ? 1.8 : 0)) / 0.9) : 0;
      c.mat.color.set('#ffd27a').lerp(geloCor, kg); c.mat.emissive.set('#ffb02e').lerp(geloEm, kg); c.mat.opacity = 0.45 + 0.4 * kg;
      c.mo.material.color.copy(ouroCor).lerp(geloCor, kg); c.mo.material.emissive.copy(ouroEm).lerp(geloEm, kg);
      c.mo.visible = dren;
      if (!dren) return;
      const vel = congela ? 0.35 * (1 - kg) : 0.35;
      c.fluxo = (c.fluxo || 0); const u0 = c.fase + (tt - T.b8) * vel * (congela ? 1 : 1);
      for (let i = 0; i < c.Nm; i++) { const u = ((congela ? c.fase + (T.congelam - T.b8) * 0.35 : u0) + i / c.Nm) % 1; const p = c.cur.getPoint(u); eu.set(tt * 4 + i, i, 0); q.setFromEuler(eu); m4.compose(vv.copy(p).divideScalar(2.4), q, sc); c.mo.setMatrixAt(i, m4); }
      c.mo.instanceMatrix.needsUpdate = true;
    });
    P.neve(tt, tt >= T.congelam && palco(tt) === 'K');
    // moedas do esconderijo: crescem na cena 9; viram gelo na 12
    let km = 0; if (tt >= T.b9 && tt < T.b10) km = suave((tt - T.b9) / 1.4); if (tt >= T.b12) km = 1;
    P.moedasEsc.count = Math.floor(km * P.moedasEscN); P.moedasEsc.visible = km > 0;
    const kg2 = tt >= T.b12 ? suave((tt - T.dois12) / 1.6) : 0;
    P.moedasEsc.material.color.copy(ouroCor).lerp(geloCor, kg2); P.moedasEsc.material.emissive.copy(ouroEm).lerp(geloEm, kg2);
    P.geloEsc.forEach((g, i) => { const k = tt >= T.b12 ? suave((tt - T.dois12 - 0.3 - i * 0.15) / 0.5) : 0; g.visible = k > 0.01; g.scale.setScalar(Math.max(0.01, k)); });
  });

  const ator = (id, v, e, lista) => { const pj = M.ator(id, v, e, jan(lista)); vis(pj, lista); return pj; };
  const eng = ator('eng', 'engenheiro', 1.0, [[0, T.b2, [0.0, 0, zA - 1.3]], [T.b6, T.b7, [0.0, 0, zA - 1.3]]]);
  const chefe = ator('chefe', 'chefe', 1.05, [[T.hackers2, T.cofre2, [-10.7, 18.5, zC + 21.0]], [T.b3, T.ceo, (tt) => (tt < T.rh - 0.05 ? [0.25, 0, zE - 1.4] : [-3.0, 0, zE - 3.0])]]);
  const ceo = ator('ceo', 'chefeCeo', 1.05, [[T.ceo, T.b4, [2.45, 0, zE - 1.4]], [T.b5, T.b6, [2.45, 0, zE - 1.4]]]);
  const comp = ator('comp', 'comparsa', 1.0, [[T.hackers2, T.cofre2, [-9.6, 18.5, zC + 21.4]], [T.b4, T.b5, [-1.6, 0, zE - 1.0]], [T.b9, T.b10, [-0.4, 0, zE + 0.6]], [T.b12, DUR, [-0.4, 0, zE + 0.6]]]);
  M.pose(eng, 'pensando', 0, T.abre); M.pose(eng, 'assustado', T.abre, T.b2);
  M.pose(eng, 'parado', T.b6, T.roda); M.pose(eng, 'apontando', T.roda, T.luzinha); M.pose(eng, 'parado', T.luzinha, T.b7);
  M.pose(chefe, 'convencido', T.hackers2, T.cofre2); M.pose(comp, 'apontando', T.hackers2, T.cofre2);
  M.pose(chefe, 'desconfiado', T.b3, T.rh); M.pose(chefe, 'apontando', T.rh, T.ceo);
  M.pose(ceo, 'acenando', T.ceo, T.b4); M.pose(ceo, 'sorriso', T.b5, T.b6);
  M.pose(comp, 'rindo', T.b4, T.estag); M.pose(comp, 'assustado', T.estag, T.b5);
  tl.to(comp.el, { rotation: 28, y: 60, duration: 0.25, ease: 'power2.in' }, T.estag + 0.15); tl.set(comp.el, { rotation: 0, y: 0 }, T.b5);
  M.pose(comp, 'convencido', T.b9, T.relaxa); M.pose(comp, 'desconfiado', T.relaxa, T.b10);
  M.pose(comp, 'rindo', T.b12, T.gelo); M.pose(comp, 'parado', T.gelo, DUR);
  // congela a pose: trava o personagem no meio da risada
  tl.to(comp.el, { '--happy': 1, '--ms': 1.1, duration: 0.05 }, T.gelo + 0.3);
  tl.set(comp.el, { filter: 'hue-rotate(160deg) saturate(.5) brightness(1.15)' }, T.gelo + 0.2);
  tl.set(comp.el, { filter: 'none' }, 0);

  // ---------- objetos 2D ----------
  const pizza = M.objeto('pizza', -1.25, 1.05, zE - 0.95, { id: 'pizza' }); Objetos.naPalavra(tl, pizza, W('ri:', 4)); Objetos.sair(tl, pizza, T.b5 - 0.1);
  const gelo = M.objeto('gelo', -0.4, 0, zE + 0.68, { id: 'gelo', sombraL: 0.6, sombraP: 0.3 }); Objetos.naPalavra(tl, gelo, W('gelo', 12));
  const luzV = M.objeto('luzVermelha', 0.42, 1.16, zA - 0.5, { id: 'luzV' }); Objetos.naPalavra(tl, luzV, W('luzinha', 6)); Objetos.sair(tl, luzV, T.b7 - 0.02);
  tl.to(luzV.dentro, { scale: 1.35, duration: 0.25, yoyo: true, repeat: 5, ease: 'sine.inOut' }, T.luzinha + 0.3);
  const email = M.naTela('email', 540, 760, 0.95, { id: 'email' }); Objetos.naPalavra(tl, email, W('tarefa', 6)); Objetos.sair(tl, email, T.roda + 0.2);
  tl.to(email.dentro, { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1 }, T.roda);

  tag('t1', 'US$ 6,34 BI', 540, 300, W('seis', 1), T.b2 - 0.1, { fs: 120 });
