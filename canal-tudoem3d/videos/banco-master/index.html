    <style>
      :root { --ink: #17121d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Baloo 2", system-ui, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      #tres { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #cenaW { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #camada2d, #camadaTela, #legendas, #flash, #motion { position: absolute; inset: 0; }
      #camada2d { z-index: 1; } #motion { z-index: 2; } #camadaTela { z-index: 3; } #legendas { z-index: 4; }
      #flash { z-index: 6; background: #fff; opacity: 0; }
      .ator { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
      .legenda { position: absolute; left: 40px; right: 40px; top: 1350px; text-align: center; font-weight: 800; font-size: 86px; line-height: 1.04; color: #fff; }
      .legenda span { display: inline-block; margin: 0 .2em; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); }
      .marca { position: absolute; left: 0; right: 0; top: 1515px; text-align: center; z-index: 5; font-weight: 800; font-size: 42px; color: #fff;
        -webkit-text-stroke: 8px rgba(23,18,29,.6); paint-order: stroke fill; opacity: .5; letter-spacing: 1px; }
      .k { -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; }
      /* cartela do nome */
      #nome { position: absolute; left: 70px; top: 300px; opacity: 0; }
      #nome .a { display: inline-block; background: #FFD93D; color: var(--ink); font-weight: 800; font-size: 74px; line-height: 1; padding: 20px 34px 8px; border: 10px solid var(--ink); border-radius: 26px; box-shadow: 0 12px 0 var(--ink); }
      #nome .b { display: inline-block; margin-top: 18px; background: #fff; color: var(--ink); font-weight: 800; font-size: 46px; line-height: 1; padding: 14px 26px 6px; border: 8px solid var(--ink); border-radius: 20px; box-shadow: 0 9px 0 var(--ink); }
      #nome .c { margin-top: 12px; font-weight: 700; font-size: 30px; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
      /* gráfico de barras */
      #grafico { position: absolute; left: 90px; right: 90px; top: 250px; height: 760px; background: rgba(16,14,30,.86); border: 10px solid var(--ink); border-radius: 46px; box-shadow: 0 16px 0 var(--ink); opacity: 0; overflow: hidden; }
      #grafico .tit { position: absolute; left: 0; right: 0; top: 34px; text-align: center; color: #fff; font-weight: 800; font-size: 58px; }
      #grafico .eixo { position: absolute; left: 60px; right: 60px; bottom: 120px; height: 8px; background: #fff; border-radius: 4px; }
      #grafico .barra { position: absolute; bottom: 128px; width: 280px; height: 0; border: 9px solid var(--ink); border-bottom: 0; border-radius: 26px 26px 0 0; }
      #grafico .b1 { left: 110px; background: linear-gradient(180deg, #7fb2ff, #2f6bdc); }
      #grafico .b2 { right: 110px; background: linear-gradient(180deg, #ffe066, #e0a210); }
      #grafico .val { position: absolute; left: -40px; right: -40px; top: -100px; text-align: center; color: #fff; font-weight: 800; font-size: 76px; }
      #grafico .rot { position: absolute; bottom: 30px; width: 280px; text-align: center; color: #fff; font-weight: 800; font-size: 50px; }
      #grafico .r1 { left: 110px; } #grafico .r2 { right: 110px; color: #FFD93D; }
      #grafico .regua { position: absolute; left: 50px; right: 50px; height: 0; border-top: 8px dashed #FF6B5E; opacity: 0; }
      #grafico .regua span { position: absolute; right: 0; top: -62px; color: #FF6B5E; font-weight: 800; font-size: 42px; }
      /* conta: paga x ganha */
      #conta { position: absolute; left: 80px; right: 80px; top: 280px; opacity: 0; text-align: center; }
      #conta .l { display: block; margin: 0 auto 22px; width: fit-content; font-weight: 800; font-size: 70px; padding: 16px 36px 4px; border: 10px solid var(--ink); border-radius: 28px; box-shadow: 0 12px 0 var(--ink); }
      #conta .l1 { background: #FFD93D; } #conta .l2 { background: #7CFF9A; } #conta .l3 { background: #FF4B3E; color: #fff; }
      /* câmera de segurança */
      #cctv { position: absolute; inset: 0; opacity: 0; pointer-events: none; font-family: "JetBrains Mono", monospace; color: #fff; }
      #cctv .bordas { position: absolute; inset: 60px; border: 6px solid rgba(255,255,255,.85); border-radius: 8px;
        -webkit-mask: linear-gradient(#000 0 0) top left/120px 120px no-repeat, linear-gradient(#000 0 0) top right/120px 120px no-repeat, linear-gradient(#000 0 0) bottom left/120px 120px no-repeat, linear-gradient(#000 0 0) bottom right/120px 120px no-repeat; }
      #cctv .rec { position: absolute; left: 100px; top: 230px; font-size: 44px; text-shadow: 0 3px 6px #000; }
      #cctv .rec i { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background: #ff2a1a; margin-right: 14px; vertical-align: -3px; }
      #cctv .data { position: absolute; right: 100px; top: 230px; font-size: 40px; text-align: right; text-shadow: 0 3px 6px #000; }
      #cctv .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,0) 2px 6px); }
      #vinheta { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; box-shadow: inset 0 0 260px 80px rgba(220,20,20,.75); }
      /* cartão final */
      #fimCard { position: absolute; inset: 0; z-index: 7; opacity: 0; background: radial-gradient(circle at 50% 40%, #4f8dff 0%, #2350d8 55%, #142c86 100%); }
      #fimCard .raios { position: absolute; left: 50%; top: 40%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.10) 0 9deg, rgba(255,255,255,0) 9deg 18deg); }
      #fimCard .logo { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-weight: 800; font-size: 150px; line-height: .95; color: #FFD93D; -webkit-text-stroke: 26px var(--ink); paint-order: stroke fill; text-shadow: 0 14px 0 var(--ink); }
      #fimCard .logo small { display: block; font-size: 96px; color: #fff; }
      #fimCard .segue { position: absolute; left: 90px; right: 90px; top: 1330px; text-align: center; font-weight: 800; font-size: 80px; color: #17121d; background: #FFD93D; border: 12px solid #17121d; border-radius: 40px; padding: 18px 10px 8px; box-shadow: 0 16px 0 #17121d; }
      #fimPj { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="112.1" data-width="1080" data-height="1920">
      <div id="palco" class="clip" data-start="0" data-duration="112.1" data-track-index="0">
        <div id="cenaW"><canvas id="tres" width="1080" height="1920"></canvas>
        <div id="camada2d"></div></div>
        <div id="vinheta"></div>
        <div id="motion">
          <div id="nome"><div class="a">DANIEL VORCARO</div><br><div class="b">dono do Banco Master</div><div class="c">ilustração</div></div>
          <div id="grafico"><div class="tit">QUANTO O CDB RENDE</div>
            <div class="regua"><span>A RÉGUA</span></div>
            <div class="barra b1"><div class="val v1">0%</div></div><div class="barra b2"><div class="val v2">0%</div></div>
            <div class="eixo"></div><div class="rot r1">BANCÃO</div><div class="rot r2">MASTER</div></div>
          <div id="conta"><span class="l l1 k1">PAGA MUITO</span><span class="l l2 k2">PRECISA GANHAR MAIS</span><span class="l l3 k3">NÃO ESTAVA GANHANDO</span></div>
          <div id="cctv"><div class="scan"></div><div class="bordas"></div><div class="rec"><i></i>REC · CAM 04</div><div class="data">17/11/2025<br>AEROPORTO</div></div>
        </div>
        <div id="camadaTela"></div>
        <div id="legendas"></div>
        <div class="marca">@_tudoem3d</div>
        <div id="fimCard"><div class="raios"></div><div class="logo"><small>TUDO EM</small>3D</div><div id="fimPj"></div><div class="segue">Segue o @_tudoem3d</div></div>
        <div id="flash"></div>
      </div>
      <audio id="som" src="audio/mix.wav" data-start="0" data-duration="112.1" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        // =====================================================================
        //  BANCO MASTER — cenas presas às palavras da narração (roteiro.md)
        // =====================================================================
        const DURACAO = 112.1, FIM_FALA = 110.1;
        const tl = gsap.timeline({ paused: true });
        const M = Montagem.criar({
          tl, dur: DURACAO, fala: window.PALAVRAS, cenario: Master3D,
          canvas: '#tres', camada2d: '#camada2d', camadaTela: '#camadaTela', legendas: '#legendas',
          filtro: (luz) => `brightness(${(cena.luz2d ? cena.luz2d(cena.t) : 1) * Math.min(1.04, luz + 0.06)}) saturate(1.06) drop-shadow(-6px 2px 0 rgba(255,214,160,.45))`,
        });
        const { t, W, B, DUR, THREE, cena } = M;
        const Z = Master3D.Z, suave = M.suave, lerp = M.lerp;
        const Wn = (txt, bloco, n) => window.PALAVRAS.filter((p) => p.bloco === bloco && p.texto.toLowerCase().replace(/[^a-zà-ú0-9%]/g, '') === txt.toLowerCase())[n];
        const zT = Z.TORRE, zF = Z.FGC, zR = Z.BRB, zC = Z.BC, zA = Z.AERO;
        const P = (z0, x, y, z) => [x, y, z0 + z];
        const LONGE = [0, -120, -900];

        const T = {
          emprest: t('empréstimos', 1), nunca: t('nunca', 1), banco1: t('banco', 1),
          b2: B(2), milhao: t('milhão', 2), mil: t('mil', 2),
          b3: B(3), fica: t('fica', 3), celular: t('celular', 3), um6: t('1', 3), talvez: t('Talvez', 3),
          b4: B(4), daniel: t('Daniel', 4), master4: t('Master.', 4), quando: t('Quando', 4), rend: t('rendimento.', 4),
          b5: B(5), cem: t('100%', 5), regua: t('régua', 5), master5: t('Master', 5), c140: t('140.', 5),
          b6: B(6), propag: t('propaganda', 6), garant: t('garantido', 6), fgc: t('FGC.', 6), seguro: t('seguro.', 6), quebra: t('quebra,', 6), ate: t('até', 6), c250: t('250', 6),
          b7: B(7), dinheiro7: t('dinheiro', 7), mas: t('Mas', 7), promete: t('promete', 7), ganhar: t('ganhar', 7), master7: t('Master', 7), parte: t('parte', 7),
          b8: B(8), fabricou: t('fabricou', 8), nunca8: t('nunca', 8), vendeu: t('vendeu', 8), brb: t('BRB,', 8), brasilia: t('Brasília.', 8), caixa: t('caixa', 8), clientes: t('clientes', 8), existem: t('existem.', 8),
          b9: B(9), c12: t('12', 9), tentou: t('tentou', 9), bc: Wn('banco', 9, 1).inicio, nao9: t('não.', 9),
          b10: B(10), vorc10: t('Vorcaro', 10), preso: t('preso', 10), manha: t('Na', 10), fecha: t('fecha', 10),
          b11: B(11), c50: t('50', 11), vorc11: t('Vorcaro', 11), indic: t('indiciado', 11), nega: t('nega', 11),
          b12: B(12), banco12: t('Banco', 12), presente: t('presente.', 12), esta2: Wn('está', 12, 1).inicio, socorro: t('socorro.', 12),
        };

        // ---------- câmera ----------
        const chaves = [];
        const K = (tt, pos, alvo, fov = 48, roll = 0) => chaves.push([tt, pos, alvo, fov, roll]);
        const CORTE = (tt, pos, alvo, fov = 48, roll = 0) => { K(tt - 0.001, null, null); K(tt, pos, alvo, fov, roll); };
        // 1 gancho: torre gigante e mergulho até o banqueiro; corte para o BRB
        K(0, [-5, 0.8, zT + 16], [0, 22, zT - 14], 58, 0.04);
        K(1.1, [0.4, 1.5, zT + 6.2], [0.1, 1.6, zT - 6], 50);
        K(T.emprest, [0.6, 1.6, zT + 5.2], [0.2, 1.3, zT - 4], 50);
        K(T.banco1 - 0.05, [0.2, 1.65, zT + 4.0], [0.1, 1.25, zT - 4], 44);
        CORTE(T.banco1, [-2, 3, zR + 17], [-1, 8, zR - 8], 52);
        K(T.b2 - 0.05, [-1.2, 2.4, zR + 13.5], [-1, 8.5, zR - 8], 50);
        // 2 a montanha de dinheiro
        CORTE(T.b2, [0.2, 1.4, zT + 7.5], [4.6, 2.2, zT - 2], 50, -0.03);
        K(T.milhao, [1.2, 2.2, zT + 6.6], [4.2, 1.6, zT - 2], 48);
        K(T.b3, [1.6, 1.8, zT + 5.4], [2.6, 1.1, zT - 1], 46);
        // 3 fica até o final / celular
        K(T.celular, [1.8, 1.7, zT + 4.6], [2.5, 1.1, zT - 1], 44);
        K(T.b4 - 0.05, [1.8, 1.7, zT + 4.2], [2.5, 1.1, zT - 1], 42);
        // 4 Daniel Vorcaro: contra-plongée com a torre atrás
        CORTE(T.b4, [0.7, 0.7, zT + 4.6], [0.1, 2.6, zT - 6], 50, 0.02);
        K(T.master4 - 0.1, [0.5, 0.75, zT + 3.9], [0.1, 3.0, zT - 6], 48);
        K(T.master4 + 0.7, [0.2, 1.6, zT + 9], [0, 4.5, zT - 6], 50);
        K(T.rend, [-1.6, 1.6, zT + 7.0], [-1.2, 1.3, zT - 3], 46);
        K(T.b5 - 0.05, [-1.6, 1.6, zT + 6.6], [-1.2, 1.3, zT - 3], 46);
        // 5 gráfico (fundo: órbita lenta na torre)
        K(T.b5, [-6, 2.5, zT + 12], [0, 6, zT - 10], 54);
        K(T.b6 - 0.05, [6, 3.0, zT + 12], [0, 7, zT - 10], 54);
        // 6 FGC
        CORTE(T.b6, [-1.5, 2.4, zF + 12], [0, 6.5, zF - 8], 52);
        K(T.fgc, [-0.6, 3.6, zF + 8.5], [0, 8.6, zF - 8], 48);
        K(T.seguro, [-0.4, 3.0, zF + 9.5], [0, 5.2, zF - 8], 50);
        K(T.quebra, [-0.2, 2.6, zF + 8.5], [0, 4.8, zF - 8], 48, 0.03);
        K(T.ate, [-2.0, 2.2, zF + 8.0], [-0.5, 3.4, zF - 8], 48);
        K(T.b7 - 0.05, [-2.4, 2.0, zF + 6.5], [-1.0, 2.6, zF - 8], 46);
        // 7 dinheiro entrando que nem água / pensa comigo
        CORTE(T.b7, [-4, 1.2, zT + 14], [1, 8, zT - 10], 56, -0.04);
        K(T.mas - 0.1, [-2, 1.4, zT + 10], [1, 6, zT - 10], 52);
        K(T.mas + 0.4, [-2.2, 1.6, zT + 5.6], [-2.4, 1.1, zT - 1], 44);
        K(T.parte, [-2.2, 1.6, zT + 5.0], [-2.4, 1.1, zT - 1], 42);
        K(T.b8 - 0.05, [-2.2, 1.7, zT + 3.8], [-2.4, 1.2, zT - 1], 36);
        // 8 PF / contratos / BRB
        CORTE(T.b8, [0.5, 1.5, zT + 6.4], [0.1, 1.5, zT - 4], 50);
        K(T.fabricou, [0.6, 1.6, zT + 5.6], [0.1, 1.5, zT - 4], 48);
        K(T.vendeu - 0.05, [0.3, 1.65, zT + 4.6], [0.1, 1.4, zT - 4], 44);
        CORTE(T.vendeu, [-8, 2.6, zR + 12], [-1, 3.0, zR - 6], 52);
        K(T.brasilia, [-4, 2.2, zR + 9], [1.5, 2.6, zR - 6], 50);
        K(T.caixa, [1.4, 1.8, zR + 6.5], [3.4, 1.0, zR - 2.5], 46);
        K(T.existem + 0.4, [1.0, 1.8, zR + 5.6], [3.2, 1.1, zR - 2.5], 44);
        // 9 BRB pagou / Banco Central disse não
        K(T.c12, [-1.5, 2.6, zR + 11], [-1, 7.5, zR - 8], 50);
        K(T.bc - 0.05, [1.0, 2.6, zR + 9.5], [-1, 8, zR - 8], 50);
        CORTE(T.bc, [0, 1.2, zC + 14], [0, 16, zC - 15], 56);
        K(T.b10 - 0.05, [0, 1.6, zC + 11], [0, 12, zC - 15], 52);
        // 10 aeroporto à noite (câmera de segurança) e manhã seguinte
        CORTE(T.b10, [7, 6.5, zA + 9], [-1, 0.8, zA - 3], 50, 0);
        K(T.preso, [4.0, 3.8, zA + 5.4], [0.0, 0.9, zA - 1.2], 46);
        K(T.manha - 0.05, [3.8, 3.6, zA + 5.0], [0.2, 0.9, zA - 1.2], 44);
        CORTE(T.manha, [-3, 1.0, zT + 15], [0, 10, zT - 10], 56);
        K(T.fecha, [-0.8, 1.6, zT + 9.5], [0, 3.2, zT - 6], 50);
        K(T.b11 - 0.05, [-0.6, 1.6, zT + 8.4], [0, 3.0, zT - 6], 48);
        // 11 cofre esvaziando / indiciado
        CORTE(T.b11, [0, 3.0, zF + 7.5], [0, 3.6, zF - 10], 52);
        K(T.vorc11 - 0.05, [0, 2.6, zF + 5.8], [0, 2.4, zF - 10], 48);
        CORTE(T.vorc11, [0.2, 1.6, zC + 5.2], [0, 1.3, zC - 3], 46);
        K(T.b12 - 0.05, [0.2, 1.6, zC + 3.8], [0, 1.3, zC - 3], 40);
        // 12 o sinal
        CORTE(T.b12, [3, 1.4, zT + 9], [1, 5, zT - 8], 52);
        K(FIM_FALA, [1.5, 1.6, zT + 6], [0.5, 3, zT - 8], 46);
        K(DUR, [1.5, 1.6, zT + 6], [0.5, 3, zT - 8], 46);

        const lerp3 = (a, b, e) => [lerp(a[0], b[0], e), lerp(a[1], b[1], e), lerp(a[2], b[2], e)];
        const eio = (x) => (x < 0 ? 0 : x > 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        cena.cam.quadro = (tt) => {
          let i = 0; while (i < chaves.length - 2 && tt >= chaves[i + 1][0]) i++;
          let a = chaves[i], b = chaves[i + 1]; if (!a[1]) a = b; if (!b[1]) b = a;
          const e = eio((tt - a[0]) / Math.max(0.001, b[0] - a[0]));
          const pos = lerp3(a[1], b[1], e), alvo = lerp3(a[2], b[2], e);
          pos[1] += Math.sin(tt * 0.9) * 0.016; pos[0] += Math.sin(tt * 0.61) * 0.022; alvo[0] += Math.sin(tt * 0.47) * 0.018;
          // tremida no "quebra" e no "não"
          const tr = Math.max(0, 1 - Math.abs(tt - T.quebra - 0.15) / 0.35) + Math.max(0, 1 - Math.abs(tt - T.nao9 - 0.1) / 0.4) + Math.max(0, 1 - Math.abs(tt - T.preso - 0.1) / 0.35);
          pos[0] += Math.sin(tt * 61) * 0.06 * tr; pos[1] += Math.cos(tt * 53) * 0.05 * tr;
          return { pos, alvo, fov: lerp(a[3], b[3], e), roll: lerp(a[4], b[4], e) };
        };
        // cortes: desfoque + clarão com zoom de 7% (o desfoque nunca mostra a borda)
        const cortes = [T.banco1, T.b2, T.b4, T.b6, T.b7, T.b8, T.vendeu, T.bc, T.b10, T.manha, T.b11, T.vorc11, T.b12];
        gsap.set('#cenaW', { filter: 'blur(0px) brightness(1)', scale: 1 });
        cortes.forEach((tc) => {
          tl.fromTo('#cenaW', { filter: 'blur(16px) brightness(1.25)', scale: 1.07 }, { filter: 'blur(0px) brightness(1)', scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, tc);
          tl.fromTo('#flash', { opacity: 0.3 }, { opacity: 0, duration: 0.2, ease: 'power2.out', immediateRender: false }, tc);
        });
        tl.set('#flash', { opacity: 0 }, 0);

        // ---------- céu, noite, tinta ----------
        const C = (h) => new THREE.Color(h);
        const ceus = [
          [0, C('#ffffff'), C('#ffffff')], [T.banco1, C('#c9fff4'), C('#fbfffd')], [T.b2, C('#fff0b0'), C('#fffbee')],
