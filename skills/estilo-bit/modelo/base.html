<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="kit/gsap.min.js"></script>
<link rel="stylesheet" href="kit/bit-kit.css">
<script src="kit/bit-kit.js"></script>
</head>
<body>
<!-- Troque __DUR__ pela duração do vídeo (fim da voz + ~1,3 s para o CTA respirar). -->
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <div id="grade" class="abs"></div>
  <div id="luz" class="abs"></div>
  <div id="luz2" class="abs"></div>
  <div id="palco" class="abs"></div>
  <div id="legendas" class="abs" style="inset:0"></div>
  <div id="vinheta" class="abs"></div>
  <div id="grao" class="abs"></div>
  <audio id="trilha-audio" src="assets/trilha.wav" data-start="0" data-duration="__DUR__" data-track-index="6" data-volume="1"></audio>
</div>

<script>
const DUR = __DUR__;
const tl = gsap.timeline({ paused: true });
const K = BIT(tl, DUR);
const { $, el, janela, entra, sai, pop, digita, PASTA, ICON } = K;

K.fundo();   // passe os trechos [[ini, fim], ...] de cada bloco do roteiro para a câmera "respirar" por bloco

/* ===== GANCHO (0 – 3 s): algo já na tela no quadro 0 ===== */
K.terminal("abre", "claude", "TEXTO DIGITADO", ["item 1", "item 2"], 0, 0.22, [1.3, 1.6], 2.4);

/* ===== CENAS: uma a cada 2–4 s, sempre amarrada à fala (veja references/componentes.md) ===== */

/* ===== CTA ===== */
// K.teclas("PALAVRA", "comenta", tChamada, tPalavraFalada, tNoDirect);

/* ===== o Bit ===== */
const bit = K.bit();
bit.chega(0.35);
bit.pisca([0.8, 4.0, 8.0]);

K.legendas(/*LEG*/[]/*FIM*/);
K.fim();
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;  // o HyperFrames procura a timeline aqui
</script>
</body>
</html>
