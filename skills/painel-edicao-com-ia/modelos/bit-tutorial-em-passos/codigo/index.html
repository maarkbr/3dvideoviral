<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="kit/gsap.min.js"></script>
<link rel="stylesheet" href="kit/bit-kit.css">
<script src="kit/bit-kit.js"></script>
<!-- Exemplo completo do estilo Bit: o Reels "5 passos" (56 s). Copie este arquivo e troque as cenas
     pelas do seu roteiro. A estrutura do #root não muda. -->
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="56.2" data-width="1080" data-height="1920">
  <div id="grade" class="abs"></div>
  <div id="luz" class="abs"></div>
  <div id="luz2" class="abs"></div>
  <div id="palco" class="abs"></div>
  <div id="legendas" class="abs" style="inset:0"></div>
  <div id="vinheta" class="abs"></div>
  <div id="grao" class="abs"></div>
  <audio id="trilha-audio" src="assets/trilha.wav" data-start="0" data-duration="56.2" data-track-index="6" data-volume="1"></audio>
</div>

<script>
const DUR = 56.2;
const tl = gsap.timeline({ paused: true });
const K = BIT(tl, DUR);
const { $, el, janela, entra, sai, pop, digita, PASTA, ICON } = K;

K.fundo([[0, 7.6], [9.4, 32.2], [32.2, 45.7], [45.7, 52.7], [52.7, DUR]]);

/* ===== abertura: gancho + promessa (0 – 9.4) ===== */
K.terminal("win", "claude — editor-ia", "edita esse reels pra mim", ["corte bruto", "legendas", "motion e som"], 0, 0.22, [1.30, 1.58, 1.86], 2.16);
K.ondas("voz", "voz.wav", 2.22, 2.98);
K.checkout("CURSO DE EDIÇÃO COM IA", "R$ 1.997", 3.42, 5.56, 5.86);
const PASSOS = ["baixa o app", "cria a pasta", "abre no Claude", "instala sozinho", "pede a edição"];
K.fichas("f", PASSOS, 6.40, 7.50);
K.salvar(7.62, 8.02, 9.20);

/* ===== passos (9.4 – 45.7) ===== */
K.trilho([9.50, 14.84, 19.94, 23.92, 32.28], 9.40, 45.55);

// passo 1: app, aba Code, não é o site
const app = janela("app", "Claude", 150, 430, 780, 400,
  `<div class="abas"><div class="aba">Chat</div><div class="aba">Cowork</div><div class="aba" id="aba-code">Code</div></div><div class="mudo" style="font-size:30px">aplicativo no computador</div>`);
entra(app, 10.30, 0.5);
tl.to("#aba-code", { background: "#F2C200", color: "#111", scale: 1.12, duration: 0.25, ease: "back.out(3)" }, 12.45);
tl.to(app, { x: -40, y: -30, scale: 0.92, duration: 0.5, ease: "power3.inOut" }, 13.4);
const site = janela("site", "navegador — claude.ai", 300, 560, 600, 300, `<div class="mudo" style="font:700 54px var(--sans);padding-top:30px;text-align:center">claude.ai</div>`);
entra(site, 13.55, 0.4);
tl.to("#app .corpo", { opacity: 0.25, duration: 0.25 }, 13.55);
const carimbo = K.carimbo("NÃO É O SITE", 14.38);
sai([app, site, carimbo], 14.78, 0.28);

// passo 2: pasta Editor IA com 3 pastas
const pastona = el(`<div id="pastona" class="abs pasta">${PASTA(260)}<div style="font:700 44px var(--sans)">Editor IA</div></div>`);
pop(pastona, 15.80, 0.4);
tl.to(pastona, { scale: 2.2, opacity: 0, duration: 0.35, ease: "power2.in" }, 16.75);
const finder = janela("finder", "Editor IA", 150, 450, 780, 440,
  `<div id="grid3">${["Bruto", "Referências", "Imagens"].map((n, i) => `<div class="pasta" id="p${i}">${PASTA(150)}<span>${n}</span></div>`).join("")}</div>`);
tl.fromTo(finder, { opacity: 0, scale: 0.6, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 16.90);
[18.20, 18.60, 19.46].forEach((t, i) => pop("#p" + i, t, 0.4));
sai(finder, 19.86, 0.28);

// passo 3: a pasta voa para dentro do Claude
const cl = janela("cl", "Claude", 150, 450, 780, 440,
  `<div class="mudo" id="semp">nenhuma pasta aberta</div><div class="arq" id="a0"><i></i>Bruto/</div><div class="arq" id="a1"><i></i>Referências/</div><div class="arq" id="a2"><i></i>Imagens/</div>`);
entra(cl, 20.40, 0.45);
const voa = el(`<div id="voa" class="abs pasta">${PASTA(130)}<span style="font-size:28px">Editor IA</span></div>`);
tl.fromTo(voa, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25 }, 20.95);
tl.to(voa, { x: 330, y: -430, scale: 0.5, duration: 0.55, ease: "power3.inOut" }, 21.15);
tl.to(voa, { opacity: 0, duration: 0.12 }, 21.65);
tl.set("#cl .tit", { textContent: "Claude — Editor IA" }, 21.70);
tl.set("#semp", { textContent: "pasta aberta: Editor IA" }, 21.70);
K.linhas(["#a0", "#a1", "#a2"], [22.90, 23.08, 23.26]);
sai(cl, 23.82, 0.28);

// passo 4: ferramentas + terminal instalando
const ferrs = ["cortar", "legendar", "animar"].map((n, i) => el(`<div class="abs ferr" style="left:${105 + i * 300}px">${ICON[n]}<span>${n}</span><div class="ck">✓</div></div>`));
[26.62, 27.44, 28.42].forEach((t, i) => pop(ferrs[i], t, 0.4));
tl.to(ferrs, { y: -110, scale: 0.88, duration: 0.45, ease: "power3.inOut" }, 29.0);
const term = janela("term", "terminal", 150, 640, 780, 390,
  `<div><span class="prompt">&gt; </span><span id="cola"></span></div><div class="ok" id="i0"><span class="mudo">instalando</span> ffmpeg…</div><div class="ok" id="i1"><span class="mudo">instalando</span> whisper…</div><div class="ok" id="i2"><span class="mudo">instalando</span> hyperframes…</div><div class="ok" id="i3"><b>✓</b>tudo pronto</div>`);
entra(term, 29.40, 0.45);
digita($("#cola"), "cola o prompt de instalação", 30.62, 0.012);
K.linhas(["#i0", "#i1", "#i2", "#i3"], [30.98, 31.22, 31.46, 31.74]);
ferrs.forEach((f) => pop(f.querySelector(".ck"), 31.78, 0.3));
sai([...ferrs, term], 32.16, 0.28);

// passo 5: referências + bruto + pedido
const CORES = ["linear-gradient(160deg,#3b2a6b,#c0517a)", "linear-gradient(160deg,#0f4c5c,#5fb49c)", "linear-gradient(160deg,#5a3e1b,#e0a33a)"];
const ed = janela("ed", "Editor IA", 150, 420, 780, 470,
  `<div style="display:flex;gap:22px"><div class="caixa"><h4>Referências</h4><div class="thumbs">${CORES.map((c, i) => `<div class="th" id="t${i}" style="background:${c}">${ICON.play}</div>`).join("")}</div></div>
   <div class="caixa" style="flex:.62"><h4>Bruto</h4><div class="thumbs"><div class="th" id="t3" style="background:linear-gradient(160deg,#222,#555)">${ICON.play}</div></div></div></div>`);
entra(ed, 32.70, 0.45);
[34.10, 34.36, 34.60, 36.62].forEach((t, i) => tl.fromTo("#t" + i, { opacity: 0, y: -140, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "bounce.out" }, t));
const chatin = el(`<div id="chatin" class="abs"><span id="pede"></span><div class="env">${ICON.enviar}</div></div>`);
entra(chatin, 37.45, 0.35);
digita($("#pede"), "edita igual às referências", 38.30, 0.03);
tl.fromTo("#chatin .env", { scale: 1 }, { scale: 1.25, duration: 0.1, yoyo: true, repeat: 1 }, 39.20);
sai([ed, chatin], 39.70, 0.28);

// resultado: a timeline se arruma
const tlw = janela("tlw", "edição", 120, 440, 840, 440, `<div id="tracks" style="position:relative;padding-top:10px"></div>`);
const tracks = $("#tracks"); const [v, L, M] = [0, 1, 2].map(() => { const d = document.createElement("div"); d.className = "trilha"; tracks.appendChild(d); return d; });
const CL = [[0, 120], [150, 110], [290, 140], [470, 100], [600, 130]]; let acc = 0;
CL.forEach(([x, w], i) => {
  const c = document.createElement("div"); c.className = "clip"; c.style.cssText = `left:${x}px;width:${w}px;background:#3A4250`; v.appendChild(c);
  tl.to(c, { x: acc - x, duration: 0.35, ease: "power3.inOut" }, 40.30); acc += w + 4;
  if (i < CL.length - 1) { const g = document.createElement("div"); g.className = "clip"; g.style.cssText = `left:${x + w}px;width:${CL[i + 1][0] - x - w}px;background:rgba(255,77,77,.35)`; v.appendChild(g); tl.to(g, { opacity: 0, scaleX: 0, duration: 0.25 }, 40.30); }
});
for (let i = 0; i < 9; i++) { const c = document.createElement("div"); c.className = "clip"; c.style.cssText = `left:${i * 68}px;width:60px;height:46px;top:12px;background:#F2C200;opacity:0`; L.appendChild(c); tl.to(c, { opacity: 1, duration: 0.12 }, 40.98 + i * 0.03); }
for (let i = 0; i < 4; i++) { const c = document.createElement("div"); c.className = "clip"; c.style.cssText = `left:${40 + i * 150}px;width:90px;background:#7C8CFF;opacity:0`; M.appendChild(c); tl.fromTo(c, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 41.52 + i * 0.05); }
const ch = document.createElement("div"); ch.id = "cabeca-tl"; tracks.appendChild(ch);
tl.fromTo(ch, { x: 0 }, { x: 740, duration: 2.3, ease: "none" }, 39.9);
entra(tlw, 39.80, 0.4); sai(tlw, 42.20, 0.28);

// ajuste por conversa
const chat = janela("chat", "Claude", 150, 450, 780, 440, `<div class="bolha eu" id="b1">deixa a legenda maior</div><div class="bolha ele" id="b2">feito ✓ aumentei a legenda</div>`);
entra(chat, 42.30, 0.4);
tl.fromTo("#b1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 43.30);
tl.fromTo("#b2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 44.40);
sai(chat, 45.50, 0.28);

/* ===== entrega (45.7 – 52.7) ===== */
K.fichas("g", PASSOS, 45.80, 47.05, true);
const pdf = K.cartao("pdf", "passo a passo", "detalhado.pdf", 375, 47.95);
tl.to(pdf, { x: -195, duration: 0.45, ease: "power3.inOut" }, 49.30);
const mais = el(`<div id="mais" class="abs" style="left:505px">+</div>`); tl.fromTo(mais, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 49.6);
const skill = K.cartao("pacote", "a skill", "editor-ia", 570, 49.95, "desliza");
const selo = K.selo("pronta pra usar", 590, 470, 51.95);
sai([pdf, skill, mais, selo], 52.60, 0.25);

/* ===== CTA (52.7 – fim) ===== */
K.teclas("SKILL", "é só comentar", 52.80, 53.28, 54.32);

/* ===== o Bit ===== */
const bit = K.bit();
bit.chega(0.35);
bit.aponta("E", 95, 0.9, 2.1);
bit.pisca([0.8, 2.6, 4.7, 7.9, 11.3, 16.2, 20.1, 25.0, 30.0, 35.2, 41.0, 44.9, 50.5, 55.0]);
bit.balanca(2.3);
bit.susto(3.96, 5.0);
bit.acena(5.56);
bit.some(6.0); bit.volta(7.62);
bit.aponta("E", 70, 7.85, 9.0);
bit.aponta("E", 95, 12.40, 13.3); bit.acena(14.40);
bit.pula(18.20); bit.pula(19.46);
bit.aponta("E", 80, 21.10, 22.0); bit.acena(22.90);
bit.aponta("D", -150, 31.74, 32.3);
bit.pula(34.36); bit.pula(36.62);
bit.aponta("E", 60, 38.4, 39.4); bit.pula(41.56); bit.acena(44.40);
bit.some(45.70);
bit.poe(-660, 30, 0.7, 52.5); tl.to(bit.el, { opacity: 1, duration: 0.4, ease: "expo.out" }, 52.75);
bit.comemora(54.32);

/* ===== legendas (geradas por scripts/legendas_bit.py) ===== */
K.legendas(/*LEG*/[]/*FIM*/);
K.fim();
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;  // o HyperFrames procura a timeline aqui
</script>
</body>
</html>
