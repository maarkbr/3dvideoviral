<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*FONTES*/
        #root { position: absolute; inset: 0; overflow: hidden; }
        .gl-sub { position: absolute; left: 0; width: 1080px; top: 1130px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700;
          font-size: 34px; letter-spacing: 0.22em; color: #e8c9a0; opacity: 0; text-transform: uppercase; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="bk-full" id="__ID__-bg"></div>
      </div>
      <script>
        (function () {
          // GLITCH — frase de impacto em tela cheia com separação RGB e fatias (0,8–1,2 s). A trilha "cai" junto (o montador faz o drop).
          const ID = "__ID__";
          const P = Object.assign({ dur: 1, linhas: [{ texto: "frase", tam: 170 }, { texto: "de impacto", tam: 300, cor: "acento" }], sub: "",
            fundo: "vermelho", quente: "#ff2a2a", frio: "#20e3ff", flash: "vermelho", segundo_pulso: 0.56, topo: 560 }, /*PARAMS*/{}/*/PARAMS*/);
          const tl = gsap.timeline({ paused: true });
          const stage = document.querySelector("#" + ID + "-bg");
          stage.style.background = BK.fundo(P.fundo, 40);
          const lines = P.linhas.map((l) => ({ texto: l.texto, tam: BK.cabe(l.texto, 1010, l.tam || 220), cor: l.cor || "branco" }));
          BK.glitchSlam(tl, stage, lines, { top: P.topo, warm: BK.cor(P.quente), cool: BK.cor(P.frio), flash: P.flash ? BK.cor(P.flash) : null,
            burst2: Math.min(P.segundo_pulso, P.dur - 0.25) });
          if (P.sub) {
            const s = BK.el("div", "gl-sub", stage, BK.esc(P.sub));
            tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 0.24);
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
