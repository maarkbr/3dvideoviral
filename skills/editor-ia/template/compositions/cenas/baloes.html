<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*FONTES*/
        #root { position: absolute; inset: 0; overflow: hidden; }
        .bl-crowd { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
        .bl-bub { position: absolute; width: 120px; height: 104px; margin: -52px 0 0 -60px; }
        .bl-idea { position: absolute; left: 0; width: 1080px; top: 170px; display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; }
        .bl-idea .bk-title { text-align: center; width: 980px; }
        .bl-glow { position: absolute; left: 340px; top: 120px; width: 400px; height: 400px; border-radius: 50%; opacity: 0; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="bk-top" id="__ID__-card"></div>
      </div>
      <script>
        (function () {
          // BALOES — pergunta grande; depois uma multidão de balões de opinião se espalha (regra center-outward-expansion)
          // e no fim se recolhe para um ícone final (ex.: lâmpada da ideia). Pessoas viram balões: nunca desenhe gente.
          const ID = "__ID__";
          const P = Object.assign({ dur: 6, rotulo: "", entrada: "desce", saida: null, titulo: null, multidao: null, final: null }, /*PARAMS*/{}/*/PARAMS*/);
          const tl = gsap.timeline({ paused: true });
          const card = document.querySelector("#" + ID + "-card");
          BK.card(tl, card, P);
          BK.rotulo(tl, card, P.rotulo);
          const T = P.titulo, M = P.multidao, F = P.final;
          const mAt = M ? (M.em == null ? P.dur * 0.35 : M.em) : null;
          const fAt = F ? (F.em == null ? P.dur - 1 : F.em) : null;
          if (T && T.texto) {
            const t = BK.titulo(card, null, T.texto, { y: 170, tam: BK.cabe(T.texto, 980, T.tam || 150) });
            tl.fromTo(t, { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power4.out" }, T.em == null ? 0.3 : T.em);
            const ate = T.ate != null ? T.ate : mAt != null ? mAt - 0.1 : fAt != null ? fAt - 0.25 : null;
            if (ate != null) BK.sai(tl, t, ate);
          }
          const items = [];
          if (M) {
            const crowd = BK.el("div", "bl-crowd", card);
            const COLORS = M.cores || ["#F5F3EE", "acento", "#F5F3EE", "#13A05B", "#F5F3EE", "#D7261E"];
            const MARK = M.marcas || ["?", "!", "?", "?", "!", "…"];
            const Q = Math.min(42, M.qtd || 34);
            for (let i = 0; i < Q; i++) {
              const col = i % 7, row = Math.floor(i / 7);
              const x = 110 + col * 143 + (row % 2) * 60 + (BK.hash(i * 3) - 0.5) * 36;
              const y = 210 + row * 120 + (BK.hash(i * 5) - 0.5) * 30;
              const b = BK.el("div", "bl-bub", crowd, BK.icon.bubble(120, BK.cor(COLORS[i % COLORS.length]), MARK[i % MARK.length]));
              b.setAttribute("data-layout-allow-overlap", "");
              b.style.left = x + "px"; b.style.top = y + "px";
              items.push({ b, x, y, d: Math.hypot(x - 540, y - 470) });
            }
            items.forEach((it, i) => {
              const at = mAt + (it.d / 560) * 0.6 + BK.hash(i * 7) * 0.08;
              tl.fromTo(it.b, { x: 540 - it.x, y: 470 - it.y, scale: 0.1, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, at);
              tl.fromTo(it.b, { rotation: 0 }, { rotation: (BK.hash(i * 9) - 0.5) * 16, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, at + 0.45);
            });
            if (M.texto) {
              const mt = BK.titulo(card, null, M.texto, { y: 780, tam: BK.cabe(M.texto, 980, 96) });
              BK.sobe(tl, mt, mAt + 0.26);
              if (fAt != null) tl.to(mt, { opacity: 0, duration: 0.2 }, fAt - 0.22);
            }
          }
          if (F) {
            if (items.length) items.forEach((it, i) => tl.to(it.b, { x: 540 - it.x, y: 470 - it.y, scale: 0, opacity: 0, duration: 0.3, ease: "power3.in" }, fAt - 0.2 + BK.hash(i * 13) * 0.08));
            const glow = BK.el("div", "bl-glow", card);
            glow.style.background = "radial-gradient(closest-side, rgba(255, 216, 77, 0.55), rgba(255, 216, 77, 0))";
            const idea = BK.el("div", "bl-idea", card);
            BK.el("div", "", idea, BK.icone(F.icone || "lampada", F.tam || 300));
            if (F.texto) { const ft = BK.el("div", "bk-title", idea, BK.rich(F.texto)); ft.style.fontSize = BK.cabe(F.texto, 980, 130) + "px"; }
            tl.fromTo(idea, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, fAt);
            tl.fromTo(glow, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 0.5, ease: "power2.out" }, fAt + 0.08);
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
